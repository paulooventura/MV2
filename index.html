<script>
(function(){ /* the picture takes the window's shape (same 768 height, wider on wide screens) */
  var r=document.documentElement, phone=r.classList.contains('phone-play');
  var iw=innerWidth, ih=innerHeight, sw=screen.width||iw, sh=screen.height||ih;
  var a=iw>ih?iw/ih:(phone?Math.max(sw,sh)/Math.min(sw,sh):iw/ih);
  var w=a>1.36?Math.min(1856,Math.round(768*a/8)*8):1024;
  if(w>1024){ window.MV_VIEW_W=w; if(phone) r.classList.add('mv-wide'); }
  r.style.setProperty('--ar',String(w/768));
})();
</script>

/* The game fills the window: biggest picture of its shape (--ar, set at load) that fits */

canvas{image-rendering:pixelated;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor;

#battleHud{display:none;box-sizing:border-box;position:fixed;top:0;left:0;right:0;z-index:9000;padding:18px 22px;background:linear-gradient(180deg,#1a0a22 0%,#120a1a 88%,transparent 100%);border-bottom:4px solid #e44;font-family:Segoe UI,system-ui,sans-serif;color:#fff;pointer-events:none;}

/* Phone landscape play — full viewport canvas, overlay pads, portrait rotate */
html.phone-play,html.phone-play body{
  width:100%;height:100%;height:100dvh;max-height:100dvh;overflow:hidden;
  padding:0;gap:0;touch-action:none;-webkit-user-select:none;user-select:none;
}
html.phone-play body{position:fixed;inset:0;}
html.phone-play .desk{display:none;}
html.phone-play .ph{display:inline;}
html.phone-play.land #gameWrap{
  position:fixed;inset:0;z-index:1;max-width:none;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
html.phone-play.land canvas{
  width:min(100vw,calc(100dvh * 1024 / 768));
  height:min(100dvh,calc(100vw * 768 / 1024));
  max-width:100%;max-height:100%;border:none;
}
html.phone-play.land #touchHud{
  position:fixed;inset:0;z-index:30;display:block!important;pointer-events:none;
  background:none;gap:0;flex-wrap:nowrap;
}
html.phone-play.land #padLeft{
  position:absolute;left:max(8px,env(safe-area-inset-left,0px));
  bottom:max(12px,env(safe-area-inset-bottom,0px));pointer-events:auto;
  display:block;width:168px;height:168px;
}
html.phone-play.land #padLeft > .d-hub,html.phone-play.land #padLeft > div:not([class]){display:none;}
html.phone-play.land #padLeft .d-dish{
  display:block;position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#4a4a54,#1a1a22 72%);
  box-shadow:inset 0 3px 10px #000c,0 5px 10px #000a;
}
html.phone-play.land #padLeft .d-plus{
  display:block;position:absolute;inset:4%;
  background:linear-gradient(180deg,#5a5a66 0%,#2c2c36 50%,#14141c 100%);
  clip-path:polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%);
}
html.phone-play.land #padLeft .d-plus:after{
  content:"";position:absolute;left:50%;top:50%;width:22%;height:22%;
  margin:-11% 0 0 -11%;border-radius:50%;background:#101018;
  box-shadow:inset 0 2px 4px #000,0 1px 0 #555;
}
html.phone-play.land #padLeft .d-diags{display:block;position:absolute;inset:0;pointer-events:none;}
html.phone-play.land #padLeft .d-diags span{
  position:absolute;width:12px;height:12px;
  border-style:solid;border-color:#d0d0d8;border-width:0 3px 0 0;
}
html.phone-play.land #padLeft .d-diags .ne{top:11%;right:11%;height:0;width:14px;border-width:3px 3px 0 0;transform:rotate(8deg);}
html.phone-play.land #padLeft .d-diags .nw{top:11%;left:11%;height:0;width:14px;border-width:3px 0 0 3px;transform:rotate(-8deg);}
html.phone-play.land #padLeft .d-diags .se{bottom:11%;right:11%;height:0;width:14px;border-width:0 3px 3px 0;transform:rotate(-8deg);}
html.phone-play.land #padLeft .d-diags .sw{bottom:11%;left:11%;height:0;width:14px;border-width:0 0 3px 3px;transform:rotate(8deg);}
html.phone-play.land #padLeft button{
  position:absolute;width:34%;height:34%;margin:0;padding:0;min-width:0;min-height:0;
  height:34%!important;background:transparent;border:none;box-shadow:none;
  color:#d8d8e0;font-size:20px;font-weight:900;border-radius:0;pointer-events:none;
}
html.phone-play.land #bU{top:0;left:33%;}
html.phone-play.land #bDn{bottom:0;left:33%;}
html.phone-play.land #bL{left:0;top:33%;}
html.phone-play.land #bR{right:0;top:33%;}
html.phone-play.land #padLeft button:active{color:#fff;filter:brightness(1.35);}
html.phone-play.land #padRight{
  position:absolute;right:max(8px,env(safe-area-inset-right,0px));
  bottom:max(12px,env(safe-area-inset-bottom,0px));pointer-events:auto;
  display:block;width:176px;height:176px;
}
html.phone-play.land #padRight button{
  position:absolute;width:64px;height:64px!important;min-width:64px;min-height:64px;opacity:.88;
  padding:0;border-radius:50%;font-size:20px;font-weight:900;letter-spacing:0;
  border:2px solid #0a0a10;box-shadow:0 2px 0 #000,0 4px 8px #0008;
  -webkit-tap-highlight-color:transparent;
}
html.phone-play.land #bE{top:0;left:50%;margin-left:-32px;background:radial-gradient(circle at 32% 28%,#ffe27a,#c89010);color:#221!important;}
html.phone-play.land #bF{top:50%;left:0;margin-top:-32px;background:radial-gradient(circle at 32% 28%,#9ad4ff,#1e5fd0);color:#fff!important;}
html.phone-play.land #bQ{top:50%;right:0;margin-top:-32px;background:radial-gradient(circle at 32% 28%,#ff8a8a,#c81c1c);color:#fff!important;}
html.phone-play.land #bSp{bottom:0;left:50%;margin-left:-32px;background:radial-gradient(circle at 32% 28%,#7ae08a,#1a8a2a);color:#fff!important;}
html.phone-play.land #padRight button.held{transform:scale(.9);filter:brightness(.8);opacity:1;}
html.phone-play.land #padLeft{opacity:.88;}
/* Wide phone picture (MV_VIEW_W): the canvas already has the screen's shape — fill it edge to edge */
html.phone-play.land.mv-wide canvas{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;}
/* CRT TV on phones: no shader there, so scanlines + tube vignette + glass over the picture */
#phoneCrt{display:none;}
html.phone-play.land.mv-tv-on #phoneCrt{display:block;position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 1.5px,rgba(0,0,0,.32) 1.5px 3px),
             radial-gradient(ellipse 75% 70% at 50% 50%,transparent 62%,rgba(0,0,0,.6) 100%);
  box-shadow:inset 0 0 40px rgba(0,0,0,.65),inset 0 0 6px #000;border-radius:3.5%/7%;
  animation:mv-flick 3.2s steps(1) infinite;}
html.phone-play.land.mv-tv-on #phoneCrt:after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(ellipse 80% 55% at 26% 10%,rgba(255,255,255,.07),transparent 55%);}
@keyframes mv-flick{0%{opacity:1}48%{opacity:.94}50%{opacity:1}86%{opacity:.97}88%{opacity:1}}
html.phone-play.land .devrow{
  position:absolute;top:max(8px,env(safe-area-inset-top,0px));
  right:max(8px,env(safe-area-inset-right,0px));pointer-events:auto;
}
html.phone-play.land .desk-only{display:none!important;}
html.phone-play.land #touchHud button{-webkit-tap-highlight-color:transparent;}
html.phone-play.land #bPause{
  position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:50%;
  transform:translateX(-50%);pointer-events:auto;min-width:52px;min-height:40px;
  font-size:20px;font-weight:900;padding:0 12px;border-radius:10px;
  background:rgba(16,12,36,.88);border:2px solid rgba(220,200,255,.7);color:#eee;
}
html.phone-play.land #bRst{
  min-width:44px;min-height:36px;font-size:11px;opacity:.8;padding:0 10px;
  background:rgba(16,12,36,.88);border:2px solid rgba(220,200,255,.7);
  color:#ff0;border-radius:10px;
}
html.phone-play.port #rotateHint{
  display:flex;position:fixed;inset:0;z-index:100000;background:#04020a;
  color:#e8d0ff;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;text-align:center;padding:max(24px,env(safe-area-inset-top)) 28px;
}
html.phone-play.port #rotateHint .rh-glyph{
  width:64px;height:108px;border:3px solid #c8a0e8;border-radius:14px;
  position:relative;animation:rh-spin 1.8s ease-in-out infinite;
}
html.phone-play.port #rotateHint .rh-glyph:after{
  content:"";position:absolute;left:50%;bottom:10px;width:16px;height:4px;
  margin-left:-8px;border-radius:2px;background:#c8a0e8;
}
html.phone-play.port #rotateHint .rh-msg{
  font:800 22px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.04em;
}
html.phone-play.port #rotateHint .rh-sub{font:14px/1.4 ui-monospace,Consolas,monospace;color:#9a88b8;}
@keyframes rh-spin{
  0%,18%{transform:rotate(0deg);}
  45%,70%{transform:rotate(90deg);}
  100%{transform:rotate(0deg);}
}
@media (max-height:380px){

}
</style>

<script>
window.onerror=function(msg,src,line,col,err){
  var s=src?String(src):'';
  if(/inpage\.js|content[_-]?script|extension:\/\/|chrome-extension:|moz-extension:|safari-extension:/i.test(s)) return true;
  var inf=document.getElementById('inf');
  if(inf){
    inf.style.color='#ff0';
    var file=s?(s.split('/').pop().split('?')[0]):'?';
    inf.textContent='ERROR: '+msg+' ('+file+':'+line+')';
  }
  console.error('MV onerror',msg,src,line,err);
  return false;
};
</script>

<script>
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',function(){
    var SW_BUILD=String(window.MV_BUILD||'108');
    if(/[?&](selftest|ci)=/i.test(location.search)) return;
    var stored=localStorage.getItem('mv_sw_build');
    if(stored!==SW_BUILD){
      localStorage.setItem('mv_sw_build',SW_BUILD);
      navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.map(function(r){return r.unregister();}));
      }).finally(function(){
        caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k);}));});
      }).finally(function(){
        navigator.serviceWorker.register('./sw.js?v='+SW_BUILD).catch(function(){});
      });
      return;
    }
    navigator.serviceWorker.register('./sw.js?v='+SW_BUILD).catch(function(){});
  });
}
